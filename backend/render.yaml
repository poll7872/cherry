services:
  - type: web
    name: cherry-backend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        value: 5432
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASS
        sync: false
      - key: DATABASE_NAME
        value: cherry
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DAYTONA_API_KEY
        sync: false
      - key: DAYTONA_API_URL
        sync: false
      - key: DEMO_EMAIL
        value: demo@cherry.app
      - key: DEMO_PASSWORD
        value: demo1234
